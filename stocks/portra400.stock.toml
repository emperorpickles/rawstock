# Approximate, measured on three of Caleb's Portra 400 negatives scanned on an
# Epson V550 (6400 ppi, gamma 2.2), not a Kodak granularity table. With the
# scanner's blur divided out, the grain is white on the film up to about
# 30 cycles/mm and the layers are nearly independent (correlation 0 to
# 0.2), so it is drawn as white grain read through the scanner spot. The
# scans give 48 µm rms of about R 8, G 9, B 17 in thin areas and R 5,
# G 6, B 13 at mid density, so grain falls with density here, as Portra's
# grainy shadows suggest. Density is the dye amount above D-min and maps
# to the scans only roughly. rms is 1000 times the density standard
# deviation through a 48 µm aperture; a 6000 px frame reads about 1.9
# times that per pixel.
[grain]
frame_mm = 35
seed = 400
texture = "white"
correlation = 0.2
[grain.red]
density = [0.0, 0.3, 0.7, 1.1, 1.5, 2.0, 2.6]
rms = [8.5, 7.5, 5.5, 5, 5, 4.5, 4]
[grain.green]
density = [0.0, 0.3, 0.7, 1.1, 1.5, 2.0, 2.6]
rms = [9.5, 9, 6.5, 6, 6, 5.5, 5]
[grain.blue]
density = [0.0, 0.3, 0.7, 1.1, 1.5, 2.0, 2.6]
rms = [17, 17, 15, 13, 12, 11, 10]

# Approximate aesthetic tuning. Portra has an anti-halation layer, so this is
# only a faint red fringe on highlights well above middle gray. Threshold is
# in scene-linear exposure after exposure_ev, where middle gray is about 0.03.
[halation]
threshold = 0.25
radius = 0.008
weight = [0.08, 0.008, 0.0]
