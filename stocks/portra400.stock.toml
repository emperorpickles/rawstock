# Kodak Portra 400, schema 1 spectral stock.
# Sensitivities and D-logH curves are the E-4050 traces from the MIT-licensed
# KODAK_PORTRA_400 module in Jan Lohse, spectral_film_lut
# (https://github.com/JanLohse/spectral_film_lut), written by
# lab/import_spectral_film_lut.py. Those arrays are measured data.
#
# Everything else marked "approximate aesthetic tuning" was shaped by eye for
# a Portra-like print. It is not a densitometer reading, a paper curve, or a
# published RMS table.

schema_version = 1
revision = 2
name = "Kodak Portra 400"
source = "spectral_film_lut, digitized from Kodak publication E-4050 (KODAK PROFESSIONAL PORTRA 400 Film). Dye scale, print curve, coupling, grain, and halation are an approximate aesthetic tuning on top of those curves."
license = "MIT"
model = "spectral"

# Datasheet placement: stops that put scene-linear 0.18 on log10(12.5 / ISO),
# the middle-gray log exposure spectral_film_lut uses for this ISO.
exposure_ev = -2.526069
# Approximate aesthetic tuning. Puts that middle gray on the open part of the
# hand-shaped print curve below, not on a measured paper exposure.
print_exposure = 1.28
# Datasheet printer balance. The spectral print neutralizes this log exposure.
# It is not a chart-scan white balance.
reference_log_exposure = -1.505150

wavelength_nm = [380, 390, 400, 410, 420, 430, 440, 450, 460, 470, 480, 490, 500, 510, 520, 530, 540, 550, 560, 570, 580, 590, 600, 610, 620, 630, 640, 650, 660, 670, 680, 690, 700, 710, 720, 730, 740, 750, 760, 770, 780]

# Approximate aesthetic tuning. Mild interlayer mixing. Each row sums to 1, so
# a neutral log exposure is unchanged. A green-heavy exposure picks up a little
# red-layer and blue-layer exposure, which pulls greens toward yellow-olive and
# takes a little edge off saturated blues.
[coupling]
matrix = [[0.90, 0.08, 0.02], [0.04, 0.90, 0.06], [0.02, 0.06, 0.92]]

