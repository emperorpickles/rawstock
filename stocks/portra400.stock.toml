# from the MIT-licensed KODAK_PORTRA_400 and KODAK_PORTRA_ENDURA modules and
# the Status M table in Jan Lohse, spectral_film_lut
# (https://github.com/JanLohse/spectral_film_lut). The film curves were
# digitized from Kodak publication E-4050. Those arrays are measured data.
#
# The negative is printed the way a lab prints it: read through Status M,
# balanced at middle gray, exposed onto Portra Endura paper, and viewed
# through that paper's dyes. Grain and halation, at the end of the file, are
# an approximate aesthetic tuning added by hand.

