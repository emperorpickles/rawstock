# Ilford HP5 Plus, schema 1 monochrome spectral stock.
# Written by lab/ilford_bw.py. APPROXIMATE: the sensitivity, the
# characteristic curve, grain, and halation are hand-drawn from the
# shapes in Ilford's published datasheet figures (wedge spectrogram
# and the ILFOTEC HC 1+31, 6.5 min at 20 C curve), not digitized from tables.
# Ilford publishes no numeric tables for these.
#
# The print is Kodak Polymax Fine-Art paper, grade 1, measured,
# from the MIT-licensed KODAK_POLYMAX module in Jan Lohse,
# spectral_film_lut (https://github.com/JanLohse/spectral_film_lut).

schema_version = 1
revision = 1
name = "Ilford HP5 Plus"
source = "Approximate hand reading of the Ilford HP5 Plus datasheet figures (wedge spectrogram to tungsten, characteristic curve in ILFOTEC HC 1+31, 6.5 min at 20 C); not a digitized table. Grain and halation are an approximate aesthetic tuning. Print curve: Kodak Professional Polymax Fine-Art paper grade 1 from spectral_film_lut (MIT, Jan Lohse)."
license = "MIT"
model = "spectral"
emulsion = "monochrome"

# Stops that place the camera's metered middle gray (scene-linear
# about 0.08) on log10(12.5 / ISO).
exposure_ev = -1.356144
# Prints that middle gray at an 18 % reflector's density.
print_exposure = 2.156368

wavelength_nm = [380, 390, 400, 410, 420, 430, 440, 450, 460, 470, 480, 490, 500, 510, 520, 530, 540, 550, 560, 570, 580, 590, 600, 610, 620, 630, 640, 650, 660, 670, 680, 690, 700, 710, 720, 730, 740, 750, 760, 770, 780]

# Approximate. One panchromatic silver layer, equal-energy, integral 1.
[sensitivity]
silver = [0.005005, 0.005487, 0.006017, 0.00588, 0.005746, 0.005363, 0.005005, 0.00446, 0.003975, 0.003423, 0.002947, 0.002596, 0.002288, 0.002235, 0.00248, 0.00275, 0.00305, 0.003384, 0.003502, 0.003626, 0.003502, 0.003384, 0.003384, 0.003384, 0.003281, 0.002793, 0.002086, 0.000999, 0.000316, 0.000079, 0.00002, 0.000006, 0.000006, 0.000006, 0.000006, 0.000006, 0.000006, 0.000006, 0.000006, 0.000006, 0.000006]

# Approximate. Net density above base + fog. The ISO speed point
# (net 0.10) sits at log10(0.8 / ISO).
[silver]
log_exposure = [-3.6, -3.3, -3, -2.7, -2.4, -2.1, -1.8, -1.5, -1.2, -0.9, -0.6, -0.3, 0, 0.3, 0.6, 0.9, 1.2]
density = [0, 0.01, 0.04, 0.1, 0.22, 0.4, 0.59, 0.78, 0.97, 1.16, 1.34, 1.52, 1.68, 1.83, 1.95, 2.04, 2.1]

# Kodak Polymax Fine-Art, grade 1, from the paper white.
[print]
log_exposure = [0.203, 0.3303, 0.5525, 0.697, 0.7725, 0.8243, 0.8675, 0.9365, 1.0325, 1.1587, 1.3129, 1.4521, 1.5707, 1.6926, 1.7983, 1.9159, 2.0044, 2.0874, 2.1273, 2.1737, 2.2719, 2.3927, 2.507, 2.7939]
density = [0, 0.0011, 0.0033, 0.0108, 0.0195, 0.0378, 0.0637, 0.1187, 0.2385, 0.4187, 0.6454, 0.8526, 1.0447, 1.2529, 1.4677, 1.7504, 1.962, 2.1249, 2.1799, 2.2177, 2.2555, 2.2598, 2.2598, 2.2598]

# Approximate aesthetic tuning, not a published granularity table.
# Silver grain: one layer, the same clouds in every channel, coarser
# than the color stocks. rms is 1000 times the density standard
# deviation through a 48 um aperture, and rises with density.
[grain]
frame_mm = 35
seed = 5
[grain.silver]
density = [0, 0.3, 0.7, 1.1, 1.5, 2]
rms = [8, 11, 14, 15, 15, 14]
size_mm = 0.006

# Approximate. A faint neutral glow: the anti-halation dye clears in
# processing. The film integrates all three channels, so equal
# weights keep it gray.
[halation]
threshold = 0.25
radius = 0.008
weight = [0.04, 0.04, 0.04]
