source = "Approximate parametric fit to Fujifilm X-T2 in-camera Velvia JPEGs. DR100, Color 0, Highlight Tone 0, Shadow Tone 0, Sharpness Normal, Noise Reduction 0, White Balance Auto. Grain Effect was Weak on the camera and is omitted, so the fit was made with grain off. Not a Fujifilm datasheet, not a 3D LUT, and not a measurement of the reversal film."
