# Fuji Velvia 50, schema 1 spectral reversal stock.
# Sensitivities, characteristic curves, and per-layer dye densities are the
# datasheet traces in the MIT-licensed FUJI_VELVIA_50 module of Jan Lohse,
# spectral_film_lut (https://github.com/JanLohse/spectral_film_lut), written
# by lab/import_spectral_film_lut.py. Those arrays are measured data.
#
# This is a separate stock from velvia.stock.toml, the parametric fit to
# in-camera JPEGs, so the two can be compared. Velvia is a slide film: its
# density falls as exposure rises, and the developed dyes are the image.
#
# The exposure placement, neutral scan balance, interlayer coupling, scan
# curve, and grain table are an approximate tuning, not measurements.
# Velvia is a Fujifilm trademark.

schema_version = 1
revision = 2
name = "Fuji Velvia 50 (spectral)"
source = "spectral_film_lut FUJI_VELVIA_50, digitized from the Fujifilm Fujichrome Velvia 50 datasheet. Exposure placement, neutral scan balance, coupling, scan curve, and grain are an approximate tuning on top of those curves."
license = "MIT"
model = "spectral"
process = "reversal"
# Approximate tuning. The datasheet red layer has lower contrast than green
# and blue, so one balance point leaves shadows warm and highlights cyan.
# Like a scanner's per-channel curves, this keeps every gray neutral.
neutral_scale = true

# Approximate placement for rawstock's camera decode. The datasheet puts
# scene-linear 0.18 on log10(12.5 / ISO), which is 0.47 stops. Fuji RAFs
# decode with the camera's metered middle gray near 0.08, about 1.33 stops
# lower, so the slide was underexposed. This matches the parametric
# Velvia's placement: scene 0.08 prints as display middle gray.
exposure_ev = 1.80
# Puts the scanned clear base (D-min) at white.
print_exposure = -0.169247
# The spectral scan balances this log exposure to neutral.
reference_log_exposure = -0.602060

wavelength_nm = [380, 390, 400, 410, 420, 430, 440, 450, 460, 470, 480, 490, 500, 510, 520, 530, 540, 550, 560, 570, 580, 590, 600, 610, 620, 630, 640, 650, 660, 670, 680, 690, 700, 710, 720, 730, 740, 750, 760, 770, 780]

# Approximate aesthetic tuning. Velvia's saturation comes largely from
# interlayer (interimage) effects, which the datasheet curves do not carry.
# Each row sums to 1, so a neutral log exposure is unchanged; a colored
# exposure is pushed away from gray.
