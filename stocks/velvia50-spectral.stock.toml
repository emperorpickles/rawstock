# Approximate aesthetic tuning, not a measurement. A slide is viewed, not
# printed: the print stage reads print_exposure + slide density, so this is
# identity through the midtones and shows the slide as it is. Above density
# 2.2 a gentle shoulder keeps some separation in D-max instead of crushing it.
[print]
log_exposure = [-1, 0, 1, 2.2, 3, 4]
density = [-1, 0, 1, 2.2, 2.75, 3.15]

# Carried over from velvia.stock.toml (#20): an approximate aesthetic tuning,
# not a published granularity table. Velvia 50 is a very fine-grained slide
# film, about a third of Portra 400's rms, with 6–10 µm dye clouds. Fujifilm
# quotes RMS granularity 9 for Velvia 50, in line with the peak here. Density
# above 2.6 (deep shadows on a slide) holds the last rms. rms is 1000 times
# the density standard deviation through a 48 µm aperture.
[grain]
frame_mm = 35
seed = 50
[grain.red]
density = [0.15, 0.40, 0.80, 1.20, 1.70, 2.20, 2.60]
rms = [4, 5, 7, 8, 7, 6, 5]
size_mm = 0.010
[grain.green]
density = [0.15, 0.40, 0.80, 1.20, 1.70, 2.20, 2.60]
rms = [4, 6, 8, 9, 8, 7, 5]
size_mm = 0.0075
[grain.blue]
density = [0.15, 0.40, 0.80, 1.20, 1.70, 2.20, 2.60]
rms = [5, 7, 9, 10, 9, 8, 6]
size_mm = 0.006
