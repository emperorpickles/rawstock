# Placeholder stock. Numbers are illustrative, not a measured film.
format_version = 1
name = "Example"
description = "Placeholder parametric stock for format design."
model = "parametric"
source = ""
license = ""

# Numeric arrays live next to this file. This one is log H and per-layer
# density (D-logH). It is not in the tree yet.
curves = "example/curves.json"

# Spectral stocks set model = "spectral" and add sensitivity and dye-density
# array files (wavelength × layer).

[coupling]
# Interlayer coupling. Uncalibrated.
amount = 0.0

[halation]
strength = 0.0
radius = 0.0
tint = [1.0, 0.3, 0.1]

[bloom]
strength = 0.0
radius = 0.0

[grain]
# Density-space grain in physical units. The pipeline scales it to the
# frame size of the exposure. `seed` feeds the shared coordinate hash.
amount = 0.0
seed = 1

# [print_scan] is filled from chart or step-wedge scans. No coefficients yet.
