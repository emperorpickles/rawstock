[workspace]
resolver = "3"
members = [
    "crates/rawstock-core",
    "crates/rawstock-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"

# rawler's X-Trans Markesteijn demosaic indexes the CFA with negative tile
# offsets cast to usize. The wrapping add is correct, but debug builds panic
# on it, so overflow checks stay off for that crate.
[profile.dev.package.rawler]
overflow-checks = false
[profile.test.package.rawler]
overflow-checks = false

# Develop tests spend their time in these crates. Optimize the crates only.
# Debug assertions and overflow checks stay on the profile defaults.
[profile.dev.package.rawstock-core]
opt-level = 2
[profile.dev.package.rawstock-cli]
opt-level = 2
[profile.test.package.rawstock-core]
opt-level = 2
[profile.test.package.rawstock-cli]
opt-level = 2
