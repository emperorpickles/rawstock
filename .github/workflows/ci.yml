name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/desktop/package-lock.json
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: check and build the UI
        working-directory: apps/ui
        run: npm ci && npm run check && npm run build
      - name: install the desktop CLI
        working-directory: apps/desktop
        run: npm ci
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        env:
          RAWSTOCK_REQUIRE_FIXTURES: "1"
        run: cargo test --workspace

  wasm:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check rawstock-core for wasm32-unknown-unknown
        run: cargo check -p rawstock-core --target wasm32-unknown-unknown
      - name: Check the GPU path for wasm32-unknown-unknown
        run: cargo check -p rawstock-core --features gpu --target wasm32-unknown-unknown

  # CPU/GPU parity on software adapters: lavapipe (Vulkan) and WARP (DX12).
  # RAWSTOCK_REQUIRE_GPU makes a missing adapter a failure, not a skip.
  gpu-vulkan:
    name: GPU parity (Vulkan, lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: cargo clippy (gpu)
        run: cargo clippy -p rawstock-core --features gpu --all-targets -- -D warnings
      - name: GPU parity
        env:
          RAWSTOCK_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
        run: cargo test -p rawstock-core --features gpu --lib "gpu::"
      - name: GPU parity on the RAW fixtures
        env:
          RAWSTOCK_REQUIRE_GPU: "1"
          RAWSTOCK_REQUIRE_FIXTURES: "1"
          WGPU_BACKEND: vulkan
        run: cargo test --release -p rawstock-core --features gpu --test gpu

  gpu-dx12:
    name: GPU parity (DX12, WARP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: GPU parity
        env:
          RAWSTOCK_REQUIRE_GPU: "1"
          WGPU_BACKEND: dx12
        run: cargo test -p rawstock-core --features gpu --lib "gpu::"
