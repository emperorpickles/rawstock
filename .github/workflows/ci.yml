name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/desktop/package-lock.json
            apps/rawstock/package-lock.json
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: check and build the UI
        working-directory: apps/ui
        run: npm ci && npm run check && npm run build
      - name: install the desktop CLI
        working-directory: apps/desktop
        run: npm ci
      - name: check and build the rawstock app
        working-directory: apps/rawstock
        run: npm ci && npm run check && npm run build
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        env:
          RAWSTOCK_REQUIRE_FIXTURES: "1"
        run: cargo test --workspace

  wasm:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check rawstock-core for wasm32-unknown-unknown
        run: cargo check -p rawstock-core --target wasm32-unknown-unknown
