name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded PR runs. Pushes to main are left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # rust-cache reads and writes the Actions cache.
  actions: write

# Main writes the shared Rust cache that pull requests restore. This branch
# also writes, so the warm re-run of the CI speed PR can be measured before
# main has populated the cache. Other pull requests only restore.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.job }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'grok/ci-speed' }}
      - name: cargo fmt
        run: cargo fmt --all -- --check

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/desktop/package-lock.json
      - name: check and build the UI
        working-directory: apps/ui
        run: npm ci && npm run check && npm run build
      - name: install the desktop CLI
        working-directory: apps/desktop
        run: npm ci

  test:
    name: clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.job }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'grok/ci-speed' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      # custom-protocol (the desktop default) makes generate_context! embed
      # apps/ui/dist. The parallel ui job is the fast signal; this repeat
      # lets clippy and test compile rawstock-desktop without waiting on it.
      - name: check and build the UI
        working-directory: apps/ui
        run: npm ci && npm run check && npm run build
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        env:
          RAWSTOCK_REQUIRE_FIXTURES: "1"
        run: cargo test --workspace

  wasm:
    name: wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.job }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'grok/ci-speed' }}
      - name: Check rawstock-core for wasm32-unknown-unknown
        run: cargo check -p rawstock-core --target wasm32-unknown-unknown
