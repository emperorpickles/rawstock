name: Alpha builds

# Unsigned Windows and macOS bundles of apps/rawstock. Runs on a version tag
# or by hand, never on pull requests: macOS runners are expensive. A tag run
# uploads the bundles and SHA-256 checksums to a draft release that a person
# publishes. A manual run keeps them as workflow artifacts only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --bundles nsis
            out: target/release/bundle/nsis/*.exe
          - name: macOS universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: alpha
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/rawstock/package-lock.json
      - name: install
        working-directory: apps/rawstock
        run: npm ci
      - name: bundle
        working-directory: apps/rawstock
        shell: bash
        run: npx tauri build ${{ matrix.args }}
      - name: checksums
        shell: bash
        run: |
          mkdir -p out
          cp ${{ matrix.out }} out/
          cd out
          for file in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$file" > "$file.sha256"
            else
              shasum -a 256 "$file" > "$file.sha256"
            fi
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: rawstock-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --draft --prerelease \
            --title "rawstock $GITHUB_REF_NAME (unsigned alpha)" \
            --notes-file apps/rawstock/ALPHA_NOTES.md
