[package]
name = "rawstock-desktop"
description = "Rawstock desktop tuner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "rawstock_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
anyhow = "1"
rawstock-core = { path = "../../../crates/rawstock-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
