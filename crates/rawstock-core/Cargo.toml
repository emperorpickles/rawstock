[package]
name = "rawstock-core"
description = "Shared core for Rawstock: RAW decode, color pipeline, stocks, rendering"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
exr = "1.73"
image = { version = "0.25", default-features = false, features = ["jpeg", "tiff"] }
rawler = "0.8"
# Already in the tree through rawler. Runs on the calling thread on wasm32.
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
toml = "1.1.8"

# GPU path, behind the `gpu` feature. wgpu's WebGPU backend serves wasm32.
bytemuck = { version = "1.25", features = ["derive"], optional = true }
wgpu = { version = "30.0.1", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12", "webgpu"] }

# Blocks on GPU setup and readback for native callers. The web awaits instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "1.0", optional = true }

# `uuid` (via rawler) has no randomness source on wasm32-unknown-unknown
# unless `js` is enabled. That feature is its WebCrypto backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.28", features = ["js"] }

[features]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dev-dependencies]
sha2 = "0.10"
