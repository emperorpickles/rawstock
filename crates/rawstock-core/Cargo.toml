[package]
name = "rawstock-core"
description = "Shared core for Rawstock: RAW decode, color pipeline, stocks, rendering"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rawler = "0.8"
thiserror = "2"

# `uuid` (via rawler) has no randomness source on wasm32-unknown-unknown
# unless `js` is enabled. That feature is its WebCrypto backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.28", features = ["js"] }

[dev-dependencies]
sha2 = "0.10"
